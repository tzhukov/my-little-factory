[package]
name = "factory"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
kube = { version = "0.93", features = ["client", "rustls-tls", "config", "jsonpatch"] }
k8s-openapi = { version = "0.22", features = ["v1_30"] }
serde_yaml = "0.9"
uuid = { version = "1.11", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
http = "1"
secrecy = "0.8"

