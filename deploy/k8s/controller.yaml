---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-controller
  namespace: factory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-controller
  namespace: factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-ctrl
  template:
    metadata:
      labels:
        app: factory-ctrl
    spec:
      serviceAccountName: factory-controller
      containers:
        - name: controller
          image: factory-controller:latest
          imagePullPolicy: IfNotPresent
