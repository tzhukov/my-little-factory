apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-controller
  namespace: factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-controller
rules:
  - apiGroups: ["factory.earendil.works"]
    resources: ["factories", "factories/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-controller
subjects:
  - kind: ServiceAccount
    name: factory-controller
    namespace: factory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-controller
  namespace: factory
  labels:
    app: factory-ctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-ctrl
  template:
    metadata:
      labels:
        app: factory-ctrl
    spec:
      serviceAccountName: factory-controller
      containers:
        - name: controller
          image: factory-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
      restartPolicy: Always
